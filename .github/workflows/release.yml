name: Release

on:
  push:
    branches: [main]
    # Skip pure docs pushes. Scoped to root *.md + docs/** so .changeset/*.md
    # still triggers the workflow (paths-ignore has no negation to re-include it).
    paths-ignore:
      - "*.md"
      - "docs/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Version Packages PR commit + git tags
      pull-requests: write # open/update the Version Packages PR
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 still ships npm 10.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      # With pending changesets -> opens/updates the "Version Packages" PR.
      # With none -> runs `npm run release` to publish any unpublished version.
      # No NPM_TOKEN: npm auth comes from GitHub OIDC via Trusted Publishing.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
